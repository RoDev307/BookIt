<ion-content [fullscreen]="true" class="lg">
  <main class="wrap">
    <!-- Marca -->
    <div class="brand">
      <span class="brand__logo"><ion-icon name="calendar-outline"></ion-icon></span>
      <span class="brand__name">BookIt</span>
    </div>

    <div class="head">
      <h1>Iniciar sesión</h1>
      <p class="muted">Accede para administrar las citas, clientes y servicios de tu negocio.</p>
    </div>

    <form class="form" (submit)="entrar($event)" novalidate>
      <!-- Error general -->
      @if (errorGeneral) {
        <div class="alert" role="alert">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ errorGeneral }}</span>
        </div>
      }

      <!-- Correo -->
      <div class="field">
        <label for="email">Correo electrónico</label>
        <div class="input" [class.input--error]="errores.email">
          <ion-icon name="mail-outline"></ion-icon>
          <input id="email" type="email" inputmode="email" autocomplete="username"
                 placeholder="tucorreo@ejemplo.com" [value]="email"
                 (input)="actualizarEmail($event)"
                 [attr.aria-invalid]="!!errores.email" />
        </div>
        @if (errores.email) { <span class="field__error">{{ errores.email }}</span> }
      </div>

      <!-- Contraseña -->
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input" [class.input--error]="errores.password">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input id="password" [type]="verPassword ? 'text' : 'password'"
                 autocomplete="current-password" placeholder="••••••••"
                 [value]="password" (input)="actualizarPassword($event)"
                 [attr.aria-invalid]="!!errores.password" />
          <button type="button" class="ojo" (click)="verPassword = !verPassword"
                  [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <ion-icon [name]="verPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        @if (errores.password) { <span class="field__error">{{ errores.password }}</span> }
      </div>

      <button type="submit" class="btn" [disabled]="cargando">
        @if (cargando) {
          <ion-spinner name="crescent"></ion-spinner> Entrando…
        } @else {
          Entrar
        }
      </button>
    </form>
  </main>
</ion-content>
