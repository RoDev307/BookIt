<div class="shell">
  <header class="navigation">
    <button
      #menuBtn
      type="button"
      class="menu-button"
      (click)="menuAbierto ? cerrarMenu() : abrirMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="menu-vistas"
      aria-label="Abrir menú de navegación"
    >
      <span aria-hidden="true">☰</span></button
    ><span>BookIt</span>
  </header>
  @if (menuAbierto) { <button class="backdrop" aria-label="Cerrar menú" (click)="cerrarMenu()"></button> }
  <aside
    class="sidebar"
    id="menu-vistas"
    [class.open]="menuAbierto"
    [attr.inert]="menuAbierto ? null : ''"
  >
    <div class="sidebar-head">
      <strong>BookIt Business</strong
      ><button type="button" (click)="cerrarMenu()" aria-label="Cerrar menú">✕</button>
    </div>
    <nav aria-label="Navegación principal">
      <a routerLink="/tabs/dashboard" routerLinkActive="active" (click)="cerrarMenu()">Dashboard</a>
      <a routerLink="/tabs/clientes" routerLinkActive="active" (click)="cerrarMenu()">Clientes</a>
      <a routerLink="/tabs/gestionar-citas" routerLinkActive="active" (click)="cerrarMenu()">Gestionar citas</a>
      <a routerLink="/tabs/agenda-diaria" routerLinkActive="active" (click)="cerrarMenu()">Calendario operativo</a>
      <a routerLink="/tabs/disponibilidad" routerLinkActive="active" (click)="cerrarMenu()">Disponibilidad</a>
      <a routerLink="/tabs/servicios" routerLinkActive="active" (click)="cerrarMenu()">Gestión de servicios</a>
      <a routerLink="/tabs/personal" routerLinkActive="active" (click)="cerrarMenu()">Personal</a>
      <a routerLink="/tabs/notificaciones" routerLinkActive="active" (click)="cerrarMenu()">Notificaciones</a>
      <a routerLink="/tabs/mi-cuenta" routerLinkActive="active" (click)="cerrarMenu()"
        >Mi cuenta y configuración</a
      >
    </nav>
  </aside>
  <div class="outlet"><ion-router-outlet></ion-router-outlet></div>
</div>
